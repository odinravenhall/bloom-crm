# Chaque push sur main met Bloom CRM à jour sur le VPS (bloom.ravencrm.xyz).
name: Déploiement
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mettre à jour le site sur le VPS
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          # La clé ne peut lancer QUE deploy/deploy-from-git.sh de Bloom sur le VPS (commande forcée).
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 root@"$HOST" deploy
