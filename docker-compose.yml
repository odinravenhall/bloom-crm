# Bloom CRM sur le VPS Zèbre. Le Caddy existant (/root/zebre) sert bloom.ravencrm.xyz -> bloom-web:3000.
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    env_file: ./.env
    environment:
      TZ: Europe/Paris
    volumes:
      - ./data:/data
    mem_limit: 256m
    networks:
      default: {}
      edge:
        aliases: [bloom-web]

networks:
  edge:
    external: true
    name: zebre_default
