<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  body { width: 300px; margin: 0; padding: 16px; font: 13px/1.45 system-ui, sans-serif; background: #1a1d21; color: #ced4da; }
  h1 { margin: 0 0 4px; font-size: 15px; color: #f1f6e8; }
  p { margin: 6px 0; }
  .muted { color: #878a99; font-size: 12px; }
  input { box-sizing: border-box; width: 100%; height: 38px; margin-top: 10px; padding: 0 10px; border: 1px solid #2f343a; border-radius: 8px; background: #212529; color: #f1f6e8; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; }
  button { width: 100%; height: 38px; margin-top: 10px; border: 0; border-radius: 8px; background: #c7ff4a; color: #12160c; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #out { margin-top: 10px; white-space: pre-line; }
  .ok { color: #3cd188; } .err { color: #f06548; }
</style>
</head>
<body>
  <h1>Relier MYM à Bloom</h1>
  <p class="muted">1. Connecte-toi à creators.mym.fans avec le compte de la modèle, dans ce Chrome.<br />2. Dans Bloom (MYM → Compte Creator), clique « Relier à MYM » et copie le code.<br />3. Colle-le ici.</p>
  <p id="who" class="muted"></p>
  <input id="code" placeholder="CODE" maxlength="12" autocomplete="off" />
  <button id="go">Relier ce compte</button>
  <div id="out"></div>
  <script src="popup.js"></script>
</body>
</html>
